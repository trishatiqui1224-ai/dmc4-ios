# =============================================================================
#  Devil May Cry 4 (Xbox 360, Title ID: 434307DF) - Codemagic CI/CD
#  Automated Native iOS/iPadOS Recompiled IPA Builder
# =============================================================================

workflows:
  ios-release:
    name: Build DMC4 iOS (ARM64 Unsigned IPA)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      vars:
        TITLE_ID: "434307DF"
      xcode: latest
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
        - pattern: master
          include: true
      tag_patterns:
        - pattern: 'v*'
          include: true
    cache:
      cache_paths:
        - $HOME/Library/Caches/Homebrew
        - $HOME/.dmc4-ios
        - $CM_BUILD_DIR/../rexglue-sdk-ios
    scripts:
      - name: Install build tools & Python packages
        script: |
          set -e
          echo "[Codemagic] Installing build tools..."
          brew install cmake ninja
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Generate Studio AppIcon & Asset Catalog
        script: |
          set -e
          echo "[Codemagic] Generating studio-grade AppIcon..."
          python3 tools/generate_appicon.py

      - name: Stage DMC4 XEX & Prepare Codegen
        script: |
          set -e
          echo "[Codemagic] Preparing DMC4 default.xex for codegen..."
          mkdir -p game generated/default xex

          if [ -f "xex/dmc4_default.xex" ]; then
            echo "[Codemagic] Staging xex/dmc4_default.xex -> game/default.xex"
            cp -f xex/dmc4_default.xex game/default.xex
            echo "[Codemagic] Staged DMC4 XEX: $(wc -c < game/default.xex) bytes"
          fi

      - name: Run DMC4 Static Recompilation Pipeline
        script: |
          set -e
          echo "[Codemagic] Running static analysis & codegen pipeline..."
          python3 tools/build_dmc4_codegen.py

      - name: Assert 0 Unresolved Branches in Generated C++
        script: |
          set -e
          echo "[Codemagic] Verifying 0 unresolved branches..."
          UNRESOLVED_COUNT=$(grep -rn "Unresolved branch from" generated/default/*.cpp 2>/dev/null | wc -l || true)
          echo "[Codemagic] Unresolved branch count: ${UNRESOLVED_COUNT}"
          if [ "${UNRESOLVED_COUNT}" -ne 0 ]; then
            echo "[FATAL] Found ${UNRESOLVED_COUNT} unresolved branches! Failing build."
            grep -rn "Unresolved branch from" generated/default/*.cpp
            exit 1
          fi
          echo "[Codemagic] Unresolved branch assertion PASSED."

      - name: Prepare ReXGlue iOS SDK & MoltenVK
        script: |
          set -e
          echo "[Codemagic] Preparing ReXGlue iOS SDK..."
          if [ ! -d "$CM_BUILD_DIR/../rexglue-sdk-ios" ]; then
            git clone --depth=1 https://github.com/rexglue/rexglue-sdk.git "$CM_BUILD_DIR/../rexglue-sdk-ios" || true
          fi

          if [ -d "$CM_BUILD_DIR/../rexglue-sdk-ios" ]; then
            cd "$CM_BUILD_DIR/../rexglue-sdk-ios"
            git tag -f v0.10.0 HEAD 2>/dev/null || true
            cd "$CM_BUILD_DIR"
            python3 tools/ios/prepare_sdk.py --sdk "$CM_BUILD_DIR/../rexglue-sdk-ios"
          fi

      - name: Configure CMake for iOS (ARM64 Native)
        script: |
          set -e
          echo "[Codemagic] Configuring CMake with iOS preset..."
          cd ios
          export CC="$(xcrun --sdk iphoneos --find clang)"
          export CXX="$(xcrun --sdk iphoneos --find clang++)"
          export OBJC="${CC}"
          export OBJCXX="${CXX}"
          cmake --preset ios \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DREX_PLATFORM_IOS=1 \
            -DCMAKE_C_COMPILER="${CC}" \
            -DCMAKE_CXX_COMPILER="${CXX}" \
            -DCMAKE_OBJC_COMPILER="${CC}" \
            -DCMAKE_OBJCXX_COMPILER="${CXX}" \
            -DCMAKE_ASM_COMPILER="${CC}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY=""

      - name: Compile and Package Unsigned IPA
        script: |
          set -e
          echo "[Codemagic] Compiling DevilMayCry4.app and packaging unsigned IPA..."
          cd ios
          cmake --build --preset ios --target ipa -- -j 4 || {
            echo "[Codemagic] Build failed! Re-running failed file with single-job diagnostics..."
            cmake --build --preset ios --target ipa -v -- -j 1
            exit 1
          }

      - name: Compute Checksums & Export Artifacts
        script: |
          set -e
          echo "[Codemagic] Preparing release artifacts..."
          mkdir -p dist
          IPA_SRC="ios/build/DMC4-iOS-unsigned.ipa"
          if [ ! -f "${IPA_SRC}" ]; then
            IPA_SRC="ios/build/DevilMayCry4.ipa"
          fi
          cp -f "${IPA_SRC}" dist/DMC4-iOS-unsigned.ipa
          cp -f "${IPA_SRC}" dist/DevilMayCry4.ipa
          cd dist
          shasum -a 256 DMC4-iOS-unsigned.ipa > SHA256SUMS.txt
          echo "[Codemagic] SHA-256 Checksum:"
          cat SHA256SUMS.txt

    artifacts:
      - dist/DMC4-iOS-unsigned.ipa
      - dist/DevilMayCry4.ipa
      - dist/SHA256SUMS.txt
      - ios/build/*.ipa
